<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1a3a">
<title>MyRoutine</title>
<style>
:root{--navy:#0a1a3a;--navy2:#0f2a55;--sheet:#f3f6fb;--card:#fff;--ink:#14213d;--mute:#6b7894;--line:#e2e8f2;--green:#22c55e;--purple:#6c4cf1;--gold:#d99a00;--red:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--navy);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Bengali",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.banner{position:relative;background:linear-gradient(135deg,#123a73,#0a1a3a 70%);border-radius:0 0 30px 30px;overflow:hidden;min-height:120px}
.banner img{display:block;width:100%;height:auto}
.banner img.custom{height:210px;object-fit:cover}
.banner::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,rgba(10,26,58,.65));pointer-events:none}
.gear{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:2;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(8,18,40,.55);color:#fff;font-size:22px;backdrop-filter:blur(6px)}
.greet{position:relative;margin:-26px 14px 0;z-index:3;background:#fff;border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.greet .gi{flex:1}
.greet small{display:block;color:var(--mute);font-size:12px}
.greet b{display:block;font-size:19px;margin:2px 0}
.greet span{font-size:13px;color:var(--mute)}
.greet .moon{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#2b3f87,#0e1b44);display:grid;place-items:center;font-size:28px}
.sheet{margin-top:14px;background:var(--sheet);border-radius:28px 28px 0 0;padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px));min-height:60vh}
.page{display:none}.page.on{display:block}
h2{font-size:17px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:8px;background:#e8edf6;border-radius:999px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:10px 0;font-size:14px;color:var(--mute)}
.tabs button.on{background:var(--purple);color:#fff;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.prog{height:8px;border-radius:99px;background:#dfe6f2;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px}
.small{font-size:13px;color:var(--mute)}
.it{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:12px;padding:11px 12px;margin-bottom:9px}
.it .ic{font-size:24px;width:30px;text-align:center}
.it .tx{flex:1;min-width:0}
.it .tm{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.it .nm{font-size:15px;font-weight:600}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid #b8c2d6;background:#fff;font-size:17px;color:#fff;flex:none;padding:0}
.chk.on{background:var(--green);border-color:var(--green)}
.it.nx{border-left-color:var(--purple);box-shadow:0 0 0 2px rgba(108,76,241,.25)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.wd{padding:8px 0;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:11px;color:var(--mute)}
.wd b{display:block;font-size:15px;color:var(--ink);margin:2px 0}
.wd i{display:grid;place-items:center;width:24px;height:24px;margin:2px auto 0;border-radius:50%;border:1px dashed #b8c2d6;font-style:normal;font-size:14px}
.wd.ok i{background:var(--green);border:0;color:#fff;font-weight:900}
.wd.today{outline:2px solid var(--purple)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--mute);padding:4px 0}
.day{position:relative;aspect-ratio:1;border-radius:12px;border:0;background:transparent;color:var(--ink);font-size:14px}
.day.t{background:var(--green);color:#fff;font-weight:700}
.day.s{outline:2px solid var(--purple)}
.day.e::after{content:"";position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--gold)}
.nav2{display:flex;gap:6px}
.mini{background:#fff;border:1px solid var(--line);border-radius:10px;min-width:40px;height:40px;padding:0 12px;color:var(--ink)}
.evrow{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}.evrow span{flex:1}
input[type=text],input[type=time],input[type=number],select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #cfd8e6;background:#fff;color:var(--ink);font:inherit;font-size:16px}
textarea{min-height:46vh;resize:vertical}
label.l{display:block;color:var(--mute);font-size:13px;margin:14px 0 6px}
.btn{width:100%;padding:14px;border-radius:14px;border:0;background:var(--purple);color:#fff;font-weight:700;font-size:16px}
.btn.alt{background:#fff;color:var(--ink);border:1px solid #cfd8e6}
.btn.gold{background:var(--gold);color:#fff}
.btn.g{background:var(--green)}
.btn+.btn{margin-top:8px}
.row2{display:flex;gap:8px;margin-top:8px}.row2>*:first-child{flex:1}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.srow .w{grid-column:1/3}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{position:relative;border-radius:16px;padding:12px;min-height:96px;color:#14201c;font-size:14px;line-height:1.35;overflow:hidden;cursor:pointer;touch-action:pan-y}
.note p{margin:0 0 18px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.note .hd{position:absolute;right:8px;bottom:4px;font-size:20px;touch-action:none;padding:4px 6px;opacity:.6}
.note.drag{opacity:.6;transform:scale(1.03)}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lrow span{flex:1}.lrow.a span{color:var(--purple);font-weight:700}
.lrow button{border:1px solid #cfd8e6;background:#fff;border-radius:10px;padding:8px 12px;min-width:92px}
.lrow.a button{background:var(--green);color:#fff;border-color:var(--green)}
.langbox{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;border:0;background:transparent;padding:9px 0 8px;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button b{font-size:21px;font-weight:400;filter:grayscale(1);opacity:.7}
#nav button.on{color:var(--purple);font-weight:700}#nav button.on b{filter:none;opacity:1}
.ov{position:fixed;inset:0;background:var(--sheet);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 40px;display:none;z-index:40}.ov.show{display:block}
#call{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:60;display:flex;align-items:center;gap:12px;padding:12px;border-radius:24px;background:#16264d;color:#fff;border:1px solid #3a5190;box-shadow:0 10px 30px rgba(0,0,0,.6);transform:translateY(-170%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
#call.show{transform:none}
.cav{width:50px;height:50px;border-radius:50%;background:#24408a;display:grid;place-items:center;font-size:24px;flex:none}
#call.ring .cav{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{box-shadow:0 0 0 18px rgba(34,197,94,0)}}
.cinfo{flex:1;min-width:0}.cinfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cinfo span{font-size:13px;color:#a9b8de}
.cb{width:52px;height:52px;border-radius:50%;border:0;color:#fff;font-size:22px;flex:none}.cb.g{background:var(--green)}.cb.r{background:var(--red)}
#print{display:none;padding:24px;color:#222;font-family:system-ui,"Noto Sans","Noto Sans Bengali",sans-serif}
#print h1{text-align:center;font-size:28px;margin:0 0 4px;color:#14573f}#print .sb{text-align:center;color:#777;margin-bottom:16px}
#print h3{margin:16px 0 6px;padding:6px 12px;border-radius:10px;background:#e7f6ee;color:#14573f}
#print table{width:100%;border-collapse:collapse}#print td{padding:8px 10px;border-bottom:1px solid #e3e3e3;font-size:16px}#print td:first-child{width:130px;font-weight:700;color:#b07d00}
@media print{body>*:not(#print){display:none!important}#print{display:block!important}body{background:#fff}}
@media (prefers-reduced-motion:reduce){#call.ring .cav{animation:none}#call{transition:none}}

.sheet{background:linear-gradient(#f8faff,#edf1fa);padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.card{border:0;box-shadow:0 2px 14px rgba(20,33,61,.07);border-radius:18px}
.it{border:0;border-left:5px solid var(--c,#22c55e);box-shadow:0 2px 12px rgba(20,33,61,.08);border-radius:16px}
.it .ic{background:#eef1f8;background:color-mix(in srgb,var(--c,#22c55e) 14%,#fff);border-radius:12px;height:38px;width:38px;display:grid;place-items:center;font-size:21px}
.it.nx{box-shadow:0 6px 18px rgba(108,76,241,.28)}
.hero{display:flex;align-items:center;gap:16px;padding:16px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#6c4cf1,#3b82f6 60%,#06b6d4);box-shadow:0 12px 26px rgba(108,76,241,.35);margin:6px 0 16px}
.ring{width:84px;height:84px;flex:none;position:relative}.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px}
.hero small{opacity:.88;font-size:12.5px;display:block}.hero .tt{font-size:18px;font-weight:700;margin:3px 0 4px}
.greet{border:1px solid rgba(108,76,241,.18);box-shadow:0 12px 28px rgba(0,0,0,.28)}
.greet b{font-size:20px;background:linear-gradient(90deg,#14213d,#6c4cf1);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{background:#e3e9f5}
.tabs button.on{background:linear-gradient(135deg,#6c4cf1,#4f7cf0);box-shadow:0 5px 14px rgba(108,76,241,.4)}
.btn{box-shadow:0 6px 16px rgba(108,76,241,.28)}.btn.alt{box-shadow:none}.btn.gold{box-shadow:0 6px 16px rgba(217,154,0,.3)}.btn.g{box-shadow:0 6px 16px rgba(34,197,94,.3)}
.filebtn{position:relative;display:block;overflow:hidden;text-align:center}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
#nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:26px;border:1px solid rgba(255,255,255,.7);box-shadow:0 12px 32px rgba(10,26,58,.32);background:rgba(255,255,255,.93);backdrop-filter:blur(14px);padding-bottom:0}
#nav button.on b{transform:translateY(-2px) scale(1.12)}
.page.on{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page.on{animation:none}}
</style>
</head>
<body>
<div class="banner">
  <img id="bimg" alt="">
  <button class="gear" id="gear" aria-label="Settings">&#9881;</button>
</div>
<div class="greet">
  <div class="gi"><small id="gdate"></small><b id="ghi"></b><span data-i="keep"></span></div>
  <div class="moon">&#127769;</div>
</div>

<div class="sheet">
  <!-- HOME -->
  <section class="page on" id="p-home">
    <div class="tabs" id="tabs">
      <button data-t="today" class="on" data-i="today"></button>
      <button data-t="weekly" data-i="weekly"></button>
      <button data-t="monthly" data-i="monthly"></button>
    </div>
    <div id="t-today">
      <h2 data-i="todays"></h2>
      <div class="hero"><div class="ring"><svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="36" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="9"/><circle id="rgf" cx="42" cy="42" r="36" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="226.2" stroke-dashoffset="226.2" style="transition:stroke-dashoffset .6s"/></svg><b id="rgp">0%</b></div><div><small id="progtxt"></small><div class="tt" id="nxt"></div><small id="nxs"></small></div></div>
      <div id="tlist"></div>
    </div>
    <div id="t-weekly" style="display:none">
      <h2 data-i="week"></h2><div class="week" id="week"></div>
      <div class="card small" id="streak" style="margin-top:12px"></div>
    </div>
    <div id="t-monthly" style="display:none">
      <h2><span id="mtitle"></span><span class="nav2"><button class="mini" id="pm" aria-label="Previous">&#8249;</button><button class="mini" id="nm" aria-label="Next">&#8250;</button></span></h2>
      <div class="card"><div class="cal" id="cal"></div></div>
      <div class="card" id="evbox"></div>
    </div>
  </section>

  <!-- TASKS -->
  <section class="page" id="p-tasks">
    <h2 data-i="routine"></h2>
    <div id="rlist"></div>
    <button class="btn alt" id="addrow" data-i="addroutine"></button>
    <button class="btn gold" id="pdf" style="margin-top:8px" data-i="pdf"></button>
    <div class="small" style="margin-top:8px" data-i="pdfhint"></div>
  </section>

  <!-- NOTES -->
  <section class="page" id="p-notes">
    <h2><span data-i="notes"></span><button class="mini" id="addnote" data-i="addnote"></button></h2>
    <div class="notes" id="nlist"></div>
  </section>

  <!-- PRAYERS -->
  <section class="page" id="p-pray">
    <h2 data-i="prayers_h"></h2>
    <div id="plist"></div>
  </section>

  <!-- PROFILE -->
  <section class="page" id="p-prof">
    <h2 data-i="settings"></h2>
    <label class="l" for="uname" data-i="yourname"></label><input type="text" id="uname">

    <label class="l" data-i="banner"></label>
    <div class="card">
      <label class="btn alt filebtn"><span data-i="bup"></span><input type="file" id="bfile" accept="image/*"></label>
      <div class="row2"><input type="text" id="burl" data-p="paste" value="https://i.postimg.cc/xC2Hm7qr/file-00000000bb788211951bfec9553da106.png"><button class="mini" id="bdl" data-i="dl"></button></div>
      <button class="btn alt" id="bres" style="margin-top:8px" data-i="breset"></button>
      <div class="small" id="bstat" style="margin-top:6px"></div>
    </div>

    <label class="l" data-i="langs"></label>
    <div class="langbox" id="langs"></div>
    <div class="small" id="lerr" style="margin-top:6px;color:#c0392b"></div>

    <label class="l" for="rt" data-i="ringtone"></label>
    <div class="row2"><select id="rt"></select><button class="mini" id="rprev" data-i="preview"></button></div>
    <label class="btn alt filebtn" style="margin-top:8px"><span data-i="ringup"></span><input type="file" id="rfile" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.amr,.flac,.3gp,.mp4" multiple></label>
    <div id="ctl" style="margin-top:8px"></div>

    <label class="l" for="rdur" data-i="ringdur"></label><input type="number" id="rdur" min="10" max="120">
    <button class="btn g" id="test" style="margin-top:14px" data-i="testcall"></button>
  </section>
</div>

<nav id="nav">
  <button data-p="home" class="on"><b>&#127968;</b><span data-i="home"></span></button>
  <button data-p="tasks"><b>&#9989;</b><span data-i="tasks"></span></button>
  <button data-p="notes"><b>&#128221;</b><span data-i="notes_n"></span></button>
  <button data-p="pray"><b>&#128332;</b><span data-i="prayers"></span></button>
  <button data-p="prof"><b>&#128100;</b><span data-i="profile"></span></button>
</nav>

<section class="ov" id="editor">
  <h2 data-i="notes"></h2>
  <label class="l" for="ntxt" data-i="notehint"></label>
  <textarea id="ntxt"></textarea>
  <button class="btn" id="nsave" style="margin-top:12px" data-i="save"></button>
  <button class="btn alt" id="ndel" data-i="del"></button>
  <button class="btn alt" id="ncancel" data-i="cancel"></button>
</section>

<div id="call" role="alertdialog" aria-live="assertive">
  <div class="cav">&#128222;</div>
  <div class="cinfo"><b id="ctitle"></b><span id="cstat"></span></div>
  <button class="cb r" id="cdec" aria-label="Decline">&#10005;</button>
  <button class="cb g" id="cacc" aria-label="Accept">&#128222;</button>
</div>
<div id="print"></div>

    var ok=!!dn[iid(it)];if(ok)done++;
    var end=L[i+1]?" - "+fmt(L[i+1].t):"";
    h+='<div class="it'+(nx===it?" nx":"")+'" style="--c:'+(KC[it.k]||"#22c55e")+'"><span class="ic">'+(EMO[it.k]||"📌")+'</span><div class="tx"><div class="tm">'+fmt(it.t)+end+(it.on?"":" 🔕")+'</div><div class="nm">'+esc(it.n)+'</div></div><button class="chk'+(ok?" on":"")+'" data-id="'+esc(iid(it))+'" aria-label="Done">'+(ok?"✓":"")+'</button></div>';
  });
  $("tlist").innerHTML=h;
  $("progtxt").textContent=t("done_of",{a:done,b:L.length});
  var pc=L.length?done/L.length:0;$("rgf").style.strokeDashoffset=226.2*(1-pc);$("rgp").textContent=Math.round(pc*100)+"%";$("nxt").textContent=nx?(EMO[nx.k]||"📌")+" "+nx.n:t("nonext");$("nxs").textContent=nx?t("next")+" · "+fmt(nx.t):"";
}
$("tlist").addEventListener("click",function(e){
  var b=e.target.closest(".chk");if(!b)return;var td=dk(new Date()),d=S.done[td]=S.done[td]||{};
  if(d[b.dataset.id])delete d[b.dataset.id];else d[b.dataset.id]=1;save();renderHome();
});

/* check-in week */
function checkin(){
  var td=dk(new Date());
  if(S.ws){var diff=Math.round((new Date(td+"T00:00:00")-new Date(S.ws+"T00:00:00"))/864e5);if(diff>=7||diff<0)S.ws=""}
  if(!S.ws){S.ws=td;S.checks={}}
  S.checks[td]=1;save();
}
function renderWeek(){
  var td=dk(new Date()),h="",n=0;
  for(var i=0;i<7;i++){
    var d=new Date(S.ws+"T00:00:00");d.setDate(d.getDate()+i);var k=dk(d);if(S.checks[k])n++;
    h+='<div class="wd'+(S.checks[k]?" ok":"")+(k===td?" today":"")+'">'+intl({weekday:"short"},d)+'<b>'+d.getDate()+'</b><i>'+(S.checks[k]?"✓":"")+'</i></div>';
  }
  $("week").innerHTML=h;$("streak").textContent=t("streak",{n:n});
}

/* calendar */
var vm=new Date();vm.setDate(1);var sel=dk(new Date());
function renderCal(){
  var y=vm.getFullYear(),m=vm.getMonth(),h="",td=dk(new Date());
  $("mtitle").textContent=intl({month:"long",year:"numeric"},vm);
  for(var i=0;i<7;i++)h+='<div class="h">'+intl({weekday:"narrow"},new Date(2023,0,1+i))+'</div>';
  var first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
  for(var i=0;i<first;i++)h+="<div></div>";
  for(var d=1;d<=n;d++){var k=y+"-"+pad(m+1)+"-"+pad(d);h+='<button class="day'+(k===td?" t":"")+(k===sel?" s":"")+((S.events[k]||[]).length?" e":"")+'" data-d="'+k+'">'+d+'</button>'}
  $("cal").innerHTML=h;renderEv();
}
function renderEv(){
  var L=S.events[sel]||[],d=new Date(sel+"T00:00:00");
  var h='<div class="small">'+esc(intl({weekday:"long",day:"numeric",month:"long",year:"numeric"},d))+'</div>';

  h+='<div class="row2"><input type="text" id="evin" placeholder="'+esc(t("addev"))+'"><button class="mini" id="evadd">'+t("add")+'</button></div>';

}
$("cal").addEventListener("click",function(e){var d=e.target.dataset.d;if(d){sel=d;renderCal()}});
$("evbox").addEventListener("click",function(e){
  if(e.target.id==="evadd"){var v=$("evin").value.trim();if(v){(S.events[sel]=S.events[sel]||[]).push(v);save();renderCal()}}
  if(e.target.dataset.ed!=null){S.events[sel].splice(+e.target.dataset.ed,1);if(!S.events[sel].length)delete S.events[sel];save();renderCal()}
});
$("pm").onclick=function(){vm.setMonth(vm.getMonth()-1);renderCal()};
$("nm").onclick=function(){vm.setMonth(vm.getMonth()+1);renderCal()};

/* ===== TASKS (routine editor) ===== */
function renderTasks(){
  $("rlist").innerHTML=S.items.map(function(it,i){

  }).join("");

$("rlist").addEventListener("input",function(e){var el=e.target;if(el.dataset.i==null)return;S.items[+el.dataset.i][el.dataset.f]=el.type==="checkbox"?el.checked:el.value;save()});
$("rlist").addEventListener("change",function(e){

  if(el.dataset.f==="t"||el.dataset.f==="on"){S.items.sort(function(a,b){return toMin(a.t)-toMin(b.t)});S.fired={day:dk(new Date())};save();renderTasks()}

$("rlist").addEventListener("click",function(e){if(e.target.dataset.del!=null){S.items.splice(+e.target.dataset.del,1);save();renderTasks();renderHome();renderPray()}});
$("addrow").onclick=function(){S.items.push({t:"09:00",n:t("taskname"),k:"work",m:"",on:true});S.items.sort(function(a,b){return toMin(a.t)-toMin(b.t)});save();renderTasks();renderHome()};
$("pdf").onclick=function(){
  var g={a:[],b:[],c:[]};

  $("print").innerHTML="<h1>🌟 "+esc(S.name)+" — "+t("routine")+"</h1><div class='sb'>"+esc(intl({day:"numeric",month:"long",year:"numeric"},new Date()))+"</div>"+sec("☀️ "+t("morning"),g.a)+sec("🌤️ "+t("afternoon"),g.b)+sec("🌙 "+t("evening"),g.c);
  window.print();
};

/* ===== PRAYERS ===== */
function renderPray(){
  var L=sorted().filter(function(i){return i.k==="prayer"}),m=nowMin(),nx=null,td=dk(new Date()),dn=S.done[td]||{};
  L.forEach(function(it){if(!nx&&dayOk(it)&&toMin(it.t)>=m)nx=it});

/* ===== NOTEBOOK ===== */
var NC=["#f6d365","#a8e6cf","#ffb7b2","#b5d8ff","#e2c6ff","#ffe0a3"],editing=-1;
function renderNotes(){$("nlist").innerHTML=S.notes.map(function(n,i){return'<div class="note" data-n="'+i+'" style="background:'+NC[i%NC.length]+'"><p>'+esc(n)+'</p><span class="hd" data-h="'+i+'" aria-label="Move">⋮⋮</span></div>'}).join("")||'<div class="small">—</div>'}
function openEd(i){editing=i;$("ntxt").value=i>=0?S.notes[i]:"";$("ndel").style.display=i>=0?"":"none";$("editor").className="ov show";$("ntxt").focus()}
$("addnote").onclick=function(){openEd(-1)};
$("ncancel").onclick=function(){$("editor").className="ov"};
$("nsave").onclick=function(){var v=$("ntxt").value.trim();if(v){if(editing>=0)S.notes[editing]=v;else S.notes.unshift(v);save()}$("editor").className="ov";renderNotes()};
$("ndel").onclick=function(){if(editing>=0){S.notes.splice(editing,1);save()}$("editor").className="ov";renderNotes()};
$("nlist").addEventListener("click",function(e){var n=e.target.closest(".note");if(n&&e.target.dataset.h==null)openEd(+n.dataset.n)});
var dragI=-1;
$("nlist").addEventListener("pointerdown",function(e){if(e.target.dataset.h==null)return;dragI=+e.target.dataset.h;e.target.setPointerCapture(e.pointerId);e.target.closest(".note").classList.add("drag")});
$("nlist").addEventListener("pointermove",function(e){
  if(dragI<0)return;var el=document.elementFromPoint(e.clientX,e.clientY),n=el&&el.closest&&el.closest(".note");
  if(n&&+n.dataset.n!==dragI){var j=+n.dataset.n,x=S.notes.splice(dragI,1)[0];S.notes.splice(j,0,x);dragI=j;renderNotes();var h=$("nlist").querySelector('[data-h="'+j+'"]');if(h){h.setPointerCapture(e.pointerId);h.closest(".note").classList.add("drag")}}
});
function endDrag(){if(dragI>=0){dragI=-1;save();renderNotes()}}
$("nlist").addEventListener("pointerup",endDrag);$("nlist").addEventListener("pointercancel",endDrag);

/* ===== RINGTONES: built-in synth + uploaded from phone (IndexedDB) ===== */
var ac=null,CT=[],aud=null;
function ctx(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}return ac}
function tone(c,f,t0,d,ty,g){var o=c.createOscillator(),v=c.createGain();o.type=ty;o.frequency.value=f;v.gain.setValueAtTime(.0001,t0);v.gain.exponentialRampToValueAtTime(g,t0+.02);v.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(v);v.connect(c.destination);o.start(t0);o.stop(t0+d+.05)}
function noise(c,t0,d,type,fc,g){var b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),a=b.getChannelData(0);for(var i=0;i<a.length;i++)a[i]=Math.random()*2-1;var s=c.createBufferSource(),f=c.createBiquadFilter(),v=c.createGain();s.buffer=b;f.type=type;f.frequency.value=fc;v.gain.setValueAtTime(.0001,t0);v.gain.exponentialRampToValueAtTime(g,t0+d*.5);v.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(f);f.connect(v);v.connect(c.destination);s.start(t0)}
function chirp(c,t0,f1,f2){var o=c.createOscillator(),v=c.createGain();o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(f2,t0+.09);o.frequency.exponentialRampToValueAtTime(f1*.8,t0+.18);v.gain.setValueAtTime(.0001,t0);v.gain.exponentialRampToValueAtTime(.25,t0+.02);v.gain.exponentialRampToValueAtTime(.0001,t0+.2);o.connect(v);v.connect(c.destination);o.start(t0);o.stop(t0+.25)}
var RT={
 rt1:[2.2,function(c,x){tone(c,659,x,.4,"sine",.5);tone(c,523,x+.45,.4,"sine",.5);tone(c,659,x+1,.4,"sine",.5);tone(c,523,x+1.45,.4,"sine",.5)}],
 rt2:[2.4,function(c,x){[784,988,1175,988].forEach(function(f,i){tone(c,f,x+i*.4,.9,"sine",.35)})}],
 rt3:[2,function(c,x){noise(c,x,2,"bandpass",3500,.12);for(var i=0;i<8;i++)tone(c,1200+Math.random()*1400,x+i*.24,.08,"sine",.18)}],
 rt4:[2.4,function(c,x){chirp(c,x,2600,3800);chirp(c,x+.3,2800,3900);chirp(c,x+.6,2400,3500);chirp(c,x+1.2,3000,4100);chirp(c,x+1.5,2700,3700)}],
 rt5:[3,function(c,x){[1,2.76,5.4].forEach(function(m,i){tone(c,220*m,x,2.8,"sine",.35/(i+1))})}],
 rt6:[3.2,function(c,x){noise(c,x,3,"lowpass",700,.5)}],
 rt7:[2.8,function(c,x){[523,587,659,784,659].forEach(function(f,i){tone(c,f,x+i*.5,.6,"triangle",.3)})}],
 rt8:[2.4,function(c,x){[523,659,784,1047,784,659].forEach(function(f,i){tone(c,f,x+i*.3,.7,"triangle",.35)})}],
 rt9:[1.2,function(c,x){for(var i=0;i<3;i++)tone(c,1000,x+i*.22,.12,"square",.18)}]
};
var DBP=null;
function idb(){return DBP||(DBP=new Promise(function(res,rej){var r=indexedDB.open("myroutine",1);r.onupgradeneeded=function(){r.result.createObjectStore("tones",{keyPath:"id",autoIncrement:true})};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}))}
function tonesAll(){return idb().then(function(d){return new Promise(function(res){var q=d.transaction("tones").objectStore("tones").getAll();q.onsuccess=function(){res(q.result)};q.onerror=function(){res([])}})}).catch(function(){return[]})}
function toneAdd(o){return idb().then(function(d){return new Promise(function(res){var q=d.transaction("tones","readwrite").objectStore("tones").add(o);q.onsuccess=function(){res(q.result)};q.onerror=function(){res(null)}})})}
function toneDel(id){return idb().then(function(d){return new Promise(function(res){var q=d.transaction("tones","readwrite").objectStore("tones").delete(id);q.onsuccess=function(){res()};q.onerror=function(){res()}})})}
function stopAud(){if(aud){try{aud.pause()}catch(e){}aud=null}}
function playCustom(id,loop){
  var o=CT.find(function(x){return"c"+x.id===id});if(!o)return false;
  stopAud();aud=new Audio(URL.createObjectURL(o.blob));aud.loop=!!loop;aud.play().catch(function(){});return true;
}
function playOnce(id){if(id[0]==="c"){playCustom(id,false);return}stopAud();var c=ctx();if(c&&RT[id])RT[id][1](c,c.currentTime+.05)}
var ringT=null,vibT=null;
function startRing(){
  if(S.ring[0]==="c"&&playCustom(S.ring,true)){}
  else{var id=RT[S.ring]?S.ring:"rt1";playOnce(id);ringT=setInterval(function(){playOnce(id)},RT[id][0]*1000)}
  function v(){if(navigator.vibrate)navigator.vibrate([900,500,900,500,900])}v();vibT=setInterval(v,3600);
}
function stopRing(){clearInterval(ringT);clearInterval(vibT);stopAud();if(navigator.vibrate)navigator.vibrate(0)}
function androidTones(){try{return JSON.parse(Android.listRingtones()||"[]")}catch(e){return[]}}
function renderRt(){
  var list=ANDROID?androidTones():CT;
  var h=Object.keys(RT).map(function(k){return'<option value="'+k+'">'+t(k)+'</option>'}).join("")+list.map(function(o){return'<option value="c'+o.id+'">🎵 '+esc(o.name)+'</option>'}).join("");
  $("rt").innerHTML=h;if($("rt").querySelector('option[value="'+S.ring+'"]'))$("rt").value=S.ring;else{S.ring="rt1";$("rt").value="rt1";save()}
  $("ctl").innerHTML=list.map(function(o){return'<div class="evrow"><span>🎵 '+esc(o.name)+'</span><button class="mini" data-cd="'+o.id+'" aria-label="'+t("del")+'">✕</button></div>'}).join("");
}
$("rt").onchange=function(){S.ring=$("rt").value;save();if(!ANDROID)playOnce(S.ring)};
$("rprev").onclick=function(){
  var v=$("rt").value;
  if(v[0]==="c"&&ANDROID){try{Android.stopPreview();Android.playPreview(v.slice(1))}catch(e){}return}
  if(aud){stopAud();return}playOnce(v);
};
function readDataUrl(f){
  return new Promise(function(res){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=function(){res(null)};fr.readAsDataURL(f)});
}
$("rfile").onchange=function(){
  var fs=Array.prototype.slice.call(this.files);this.value="";
  if(!fs.length)return;
  if(ANDROID){
    var p=Promise.resolve();
    fs.forEach(function(f){
      p=p.then(function(){return readDataUrl(f)}).then(function(dataUrl){
        if(!dataUrl)return;
        try{var id=Android.saveRingtone(f.name,dataUrl);if(id)S.ring="c"+id}catch(e){}
      });
    });
    p.then(function(){save();renderRt()});
    return;
  }
  var p2=Promise.resolve();
  fs.forEach(function(f){
    p2=p2.then(function(){return toneAdd({name:f.name,blob:f})}).then(function(id){if(id)S.ring="c"+id});
  });
  p2.then(function(){return tonesAll()}).then(function(l){CT=l;save();renderRt()});
};
$("ctl").addEventListener("click",function(e){
  var id=e.target.dataset.cd;if(id==null)return;
  if(ANDROID){try{Android.deleteRingtone(id)}catch(e){}if(S.ring==="c"+id)S.ring="rt1";save();renderRt();return}
  toneDel(+id).then(function(){
    if(S.ring==="c"+id)S.ring="rt1";
    return tonesAll();
  }).then(function(l){CT=l;save();renderRt()});
});

/* ===== PROFILE: languages ===== */
function renderLangs(){
  $("langs").innerHTML=LANGS.map(function(l){
    var a=l[0]===S.lang,r=ready(l[0]);
    return'<div class="lrow'+(a?" a":"")+'"><span>'+(r?"✓ ":"")+l[1]+'</span><button data-l="'+l[0]+'">'+(a?t("active"):r?t("use"):t("dl"))+'</button></div>';
  }).join("");
}
$("langs").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var c=b.dataset.l;$("lerr").textContent="";
  if(ready(c)){S.lang=c;save();setLang(c);return}
  b.disabled=true;b.textContent=t("dling");
  downloadLang(c).then(function(){S.lang=c;save();setLang(c)})
  .catch(function(){b.disabled=false;b.textContent=t("dl");$("lerr").textContent=t("dlfail")});
});
$("uname").oninput=function(){S.name=this.value.trim()||"Friend";save();renderHome()};
$("rdur").onchange=function(){S.ringdur=Math.max(10,+this.value||60);save()};
$("test").onclick=function(){go("home");if(ANDROID){Android.testCall();return}var it=sorted().find(function(i){return i.k==="prayer"})||S.items[0];if(it)startCall(it)};

/* ===== CALL (heads-up banner) ===== */
var cur=null,endT=null,inCall=false;
function startCall(it){
  inCall=true;cur=it;
  $("ctitle").textContent=(EMO[it.k]||"📌")+" "+it.n+" · "+fmt(it.t);
  $("cstat").textContent=t("incoming");$("cacc").style.display="";
  $("call").className="show ring";startRing();
  endT=setTimeout(endCall,(+S.ringdur||60)*1000);
}
function endCall(){clearTimeout(endT);stopRing();if(window.speechSynthesis)speechSynthesis.cancel();$("call").className="";inCall=false;cur=null;renderHome()}
function voice(c){var v=speechSynthesis.getVoices(),b=c.split("-")[0].toLowerCase();return v.find(function(x){return x.lang.toLowerCase()===c.toLowerCase()&&x.localService})||v.find(function(x){return x.lang.toLowerCase().indexOf(b)===0&&x.localService})||v.find(function(x){return x.lang.toLowerCase().indexOf(b)===0})||null}
$("cacc").onclick=function(){
  if(!cur)return;clearTimeout(endT);stopRing();
  $("call").className="show";$("cstat").textContent=t("connected");$("cacc").style.display="none";
  var it=cur,text,td=dk(new Date());
  (S.done[td]=S.done[td]||{})[iid(it)]=1;save();
  if(it.m&&it.m.trim())text=S.name+(S.lang==="bn"?" স্যার, ":", ")+it.m;
  else if(S.lang==="bn")text=S.name+" স্যার, "+(BNMSG[it.k]||("এখন "+it.n+" করার সময় হয়েছে।"));
  else text=t("callmsg",{name:S.name,task:it.n});
  if(!window.speechSynthesis){setTimeout(endCall,3000);return}
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text),v=voice(S.lang);
  u.lang=v?v.lang:(S.lang==="bn"?"bn-BD":S.lang);if(v)u.voice=v;u.rate=.9;
  u.onend=function(){setTimeout(endCall,1200)};u.onerror=function(){setTimeout(endCall,1200)};
  speechSynthesis.speak(u);
};
$("cdec").onclick=endCall;
document.addEventListener("pointerdown",function(){ctx();if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}},{once:true});

setInterval(function(){
  var n=new Date(),m=n.getHours()*60+n.getMinutes(),k=dk(n);
  if(S.fired.day!==k){S.fired={day:k};checkin();renderAll()}
  if(!ANDROID&&!inCall)S.items.forEach(function(it){
    var id=iid(it);
    if(it.on&&dayOk(it)&&toMin(it.t)===m&&!S.fired[id]){S.fired[id]=1;save();startCall(it)}
  });
},1000);

function renderAll(){renderHome();renderWeek();renderCal();renderTasks();renderNotes();renderPray();renderRt();renderLangs()}

/* ===== INIT ===== */
$("uname").value=S.name;$("rdur").value=S.ringdur;
loadBanner();checkin();setLang(S.lang);
if(ANDROID){renderRt()}else{tonesAll().then(function(l){CT=l;renderRt()})}
</script>
